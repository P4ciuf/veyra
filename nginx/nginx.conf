# Only send "Connection: upgrade" when the client actually requests a
# WebSocket upgrade; plain HTTP requests must not carry the upgrade header.
# The active server below uses $connection_upgrade, so the map must be defined
# even while the HTTPS server is still disabled.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

