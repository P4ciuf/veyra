services:
  db:
    image: postgres:18-alpine
    container_name: veyra_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not defined in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-veyra-main}
    volumes:
      - veyra_db:/var/lib/postgresql
    networks:
      - veyra-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-veyra-main}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    container_name: veyra-site
    restart: unless-stopped
    environment:
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is not defined in the .env file}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is not defined in the .env file}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is not defined in the .env file}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is not defined in the .env file}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is not defined in the .env file}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is not defined in the .env file}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is not defined in the .env file}
      # Optional: without NEXTAUTH_SECRET, NextAuth only fails on auth routes.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: 0.0.0.0
    networks:
      - veyra-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: veyra_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - veyra-net
    depends_on:
      site:
        condition: service_healthy

  discord-bot:
    build:
      context: .
      dockerfile: apps/discordBot/Dockerfile
      target: runtime
    container_name: veyra-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is not defined in the .env file}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is not defined in the .env file}
      SITE_API_URL: http://site:3000
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - veyra-net
    depends_on:
      site:
        condition: service_healthy
    # No healthcheck: the bot exposes no HTTP server, so a TCP probe on :3001
    # would always report unhealthy.

networks:
  veyra-net:
    driver: bridge

volumes:
  veyra_db:
